repos:
  - repo: local
    hooks:
      - id: gauntlet-fast
        name: gauntlet-fast (ruff + mypy --strict, archivos cambiados)
        entry: just gauntlet-fast
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
