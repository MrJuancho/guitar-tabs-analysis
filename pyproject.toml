[project]
name = "guitar_tabs_analysis"
version = "0.1.0"
description = "Guitar Tabs Analysis"
readme = "README.md"
authors = [
    { name = "MrJuancho (Juan Davila)", email = "juancho131401@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "soundfile>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guitar_tabs_analysis"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "mutmut>=3.0",
    "mypy>=1.10",
    "pandas-stubs",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "types-PyYAML",
]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "soundfile"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "holdout: tests de retención, no visibles al agente",
]

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]

# --------------------------------------------------------------------
# Contratos de import-linter -- ESPECÍFICO DEL DOMINIO.
#
# El ejemplo de abajo es FUNCIONAL (pasa `uv run lint-imports` tal como
# viene generado, contra el esqueleto de src/guitar_tabs_analysis/ incluido
# en este template) pero las capas son un placeholder de dos niveles
# (ingestion -> analytics), no una arquitectura real. Reemplázalas por las
# capas verdaderas de tu proyecto. Si tu orquestador (un pipeline.py, un
# main.py) necesita importar de varias capas a la vez para coordinarlas,
# NO lo agregues a la lista `layers` -- déjalo fuera del contrato a
# propósito, como una excepción documentada, en vez de forzarlo a encajar
# en una capa. Ver AGENTS.md, sección "Arquitectura".
# --------------------------------------------------------------------
[tool.importlinter]
root_package = "guitar_tabs_analysis"

[[tool.importlinter.contracts]]
name = "Capas: no se saltan ni se invierten (EJEMPLO -- reemplaza por tu arquitectura real)"
type = "layers"
layers = [
    "guitar_tabs_analysis.analytics",
    "guitar_tabs_analysis.ingestion",
]

[[tool.importlinter.contracts]]
name = "quality es transversal: no depende de analytics (EJEMPLO)"
type = "forbidden"
source_modules = ["guitar_tabs_analysis.quality"]
forbidden_modules = [
    "guitar_tabs_analysis.analytics",
]
