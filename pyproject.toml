[project]
name = "guitar_tabs_analysis"
version = "0.1.0"
description = "Guitar Tabs Analysis"
readme = "README.md"
authors = [
    { name = "MrJuancho (Juan Davila)", email = "juancho131401@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "scipy>=1.11",
    "demucs>=4.1",
    # torch es transitiva de demucs, pero se declara explícita para que
    # [tool.uv.sources] (abajo) pueda enrutarla al índice CPU-only --
    # uv no aplica `sources` a dependencias puramente transitivas
    # (verificado empíricamente en esta sesión: sin esta línea, uv
    # resuelve torch desde PyPI con runtimes de CUDA de todos modos).
    "torch>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guitar_tabs_analysis"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "mutmut>=3.0",
    "mypy>=1.10",
    "pandas-stubs",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "scipy-stubs>=1.11",
    "types-PyYAML",
]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "soundfile"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "holdout: tests de retención, no visibles al agente",
    "modelo_real: el único test que ejercita el sistema completo con el modelo real; se salta sin red o sin pesos cacheados (research.md #7 de 003-separacion-modelo-preentrenado)",
]

[tool.mutmut]
source_paths = ["src/"]
# `tests/unit/test_atribuciones.py` lee `docs/ATRIBUCIONES.md` por ruta
# relativa al repositorio -- mutmut solo copia `source_paths` (más
# `tests/`) a su sandbox `mutants/`, así que sin esto la corrida limpia
# de mutmut falla con `FileNotFoundError` antes de mutar nada (hallazgo
# de la Feature 003, T022 -- mismo patrón que AGENTS.md ya documenta
# para "una compuerta que no puede verificar nada").
also_copy = ["docs/"]
# `-m "not modelo_real"`: excluye el único test que carga el modelo real
# (research.md #7 de 003-separacion-modelo-preentrenado) -- sin esto, un
# mutante que produce una entrada patológica (p. ej. un tamaño de
# remuestreo desbordado) hace que la inferencia real se cuelgue o tarde
# muchísimo, y mutmut lo reporta como `timeout` en vez de `survived` o
# `killed` -- una corrida real mostró 22/32 mutantes de
# `separacion.separador` en `timeout` y CERO en `killed` hasta corregir
# esto (hallazgo de la Feature 003, T022).
pytest_add_cli_args_test_selection = ["tests/", "-m", "not modelo_real"]

# --------------------------------------------------------------------
# torch solo-CPU -- research.md #7 de 003-separacion-modelo-preentrenado.
# Sin esto, `demucs` arrastra la rueda de PyPI que incluye runtimes de
# CUDA (~555 MB) aunque el hardware del proyecto no tenga GPU utilizable
# (AMD, sin ROCm probado en WSL). La rueda `+cpu` del índice dedicado pesa
# ~187 MB.
# --------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# --------------------------------------------------------------------
# Contratos de import-linter -- ESPECÍFICO DEL DOMINIO.
#
# El ejemplo de abajo es FUNCIONAL (pasa `uv run lint-imports` tal como
# viene generado, contra el esqueleto de src/guitar_tabs_analysis/ incluido
# en este template) pero las capas son un placeholder de dos niveles
# (ingestion -> analytics), no una arquitectura real. Reemplázalas por las
# capas verdaderas de tu proyecto. Si tu orquestador (un pipeline.py, un
# main.py) necesita importar de varias capas a la vez para coordinarlas,
# NO lo agregues a la lista `layers` -- déjalo fuera del contrato a
# propósito, como una excepción documentada, en vez de forzarlo a encajar
# en una capa. Ver AGENTS.md, sección "Arquitectura".
# --------------------------------------------------------------------
[tool.importlinter]
root_package = "guitar_tabs_analysis"

[[tool.importlinter.contracts]]
name = "Capas: no se saltan ni se invierten (EJEMPLO -- reemplaza por tu arquitectura real)"
type = "layers"
layers = [
    "guitar_tabs_analysis.separacion",
    "guitar_tabs_analysis.analytics",
    "guitar_tabs_analysis.ingestion",
]

[[tool.importlinter.contracts]]
name = "quality es transversal: no depende de analytics (EJEMPLO)"
type = "forbidden"
source_modules = ["guitar_tabs_analysis.quality"]
forbidden_modules = [
    "guitar_tabs_analysis.analytics",
]
