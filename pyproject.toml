[project]
name = "guitar_tabs_analysis"
version = "0.1.0"
description = "Guitar Tabs Analysis"
readme = "README.md"
authors = [
    { name = "MrJuancho (Juan Davila)", email = "juancho131401@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "scipy>=1.11",
    "demucs>=4.1",
    # torch es transitiva de demucs, pero se declara explícita para que
    # [tool.uv.sources] (abajo) pueda enrutarla al índice CPU-only --
    # uv no aplica `sources` a dependencias puramente transitivas
    # (verificado empíricamente en esta sesión: sin esta línea, uv
    # resuelve torch desde PyPI con runtimes de CUDA de todos modos).
    "torch>=2.1",
    # Feature 006 (hito 2, detección de notas): T005-T009 (analytics
    # `evaluar_subconjunto`) solo necesitan mir_eval/mirdata -- ambas
    # MIT/BSD-3-Clause, resuelven sin arrastrar tensorflow. `basic-pitch`
    # (research.md #1/#2 de 006-deteccion-notas-guitarra-limpia) NO se
    # agrega en este slice: verificado contra su `pyproject.toml` real
    # (github.com/spotify/basic-pitch, rama `main`, idéntico a la versión
    # 0.4.0 publicada en PyPI) que su dependencia base -- no bajo NINGÚN
    # extra -- incluye `tensorflow>=2.4.1,<2.15.1; platform_system !=
    # 'Darwin' and python_version >= '3.11'`, y esa franja de tensorflow
    # no publica ninguna rueda para cp312 (confirmado contra PyPI:
    # tensorflow 2.15.0 solo trae cp39/cp310/cp311) -- instalar
    # `basic-pitch[onnx]` es irresoluble en este proyecto
    # (`requires-python = ">=3.12"`) sin importar qué extra se elija, no
    # solo indeseable. T002 queda documentado como bloqueado, no completo
    # -- ver tasks.md.
    "mir_eval>=0.7",
    "mirdata>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guitar_tabs_analysis"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "mutmut>=3.0",
    "mypy>=1.10",
    "pandas-stubs",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "scipy-stubs>=1.11",
    "types-PyYAML",
]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "soundfile"
ignore_missing_imports = true

# mir_eval no distribuye stubs ni un marcador `py.typed` (Feature 006,
# T009) -- mismo tratamiento que soundfile arriba.
[[tool.mypy.overrides]]
module = "mir_eval.*"
ignore_missing_imports = true

# mirdata tampoco distribuye stubs ni un marcador `py.typed` (Feature 006,
# T012, verificado contra el paquete instalado) -- mismo tratamiento.
[[tool.mypy.overrides]]
module = "mirdata.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "holdout: tests de retención, no visibles al agente",
    "modelo_real: el único test que ejercita el sistema completo con el modelo real; se salta sin red o sin pesos cacheados (research.md #7 de 003-separacion-modelo-preentrenado)",
]

[tool.mutmut]
source_paths = ["src/"]
# `tests/unit/test_atribuciones.py` lee `docs/ATRIBUCIONES.md` por ruta
# relativa al repositorio -- mutmut solo copia `source_paths` (más
# `tests/`) a su sandbox `mutants/`, así que sin esto la corrida limpia
# de mutmut falla con `FileNotFoundError` antes de mutar nada (hallazgo
# de la Feature 003, T022 -- mismo patrón que AGENTS.md ya documenta
# para "una compuerta que no puede verificar nada").
also_copy = ["docs/"]
# `-m "not modelo_real"`: excluye el único test que carga el modelo real
# (research.md #7 de 003-separacion-modelo-preentrenado) -- sin esto, un
# mutante que produce una entrada patológica (p. ej. un tamaño de
# remuestreo desbordado) hace que la inferencia real se cuelgue o tarde
# muchísimo, y mutmut lo reporta como `timeout` en vez de `survived` o
# `killed` -- una corrida real mostró 22/32 mutantes de
# `separacion.separador` en `timeout` y CERO en `killed` hasta corregir
# esto (hallazgo de la Feature 003, T022).
pytest_add_cli_args_test_selection = ["tests/", "-m", "not modelo_real"]

# --------------------------------------------------------------------
# torch solo-CPU -- research.md #7 de 003-separacion-modelo-preentrenado.
# Sin esto, `demucs` arrastra la rueda de PyPI que incluye runtimes de
# CUDA (~555 MB) aunque el hardware del proyecto no tenga GPU utilizable
# (AMD, sin ROCm probado en WSL). La rueda `+cpu` del índice dedicado pesa
# ~187 MB.
# --------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# --------------------------------------------------------------------
# Contratos de import-linter -- ESPECÍFICO DEL DOMINIO.
#
# El ejemplo de abajo es FUNCIONAL (pasa `uv run lint-imports` tal como
# viene generado, contra el esqueleto de src/guitar_tabs_analysis/ incluido
# en este template) pero las capas son un placeholder de dos niveles
# (ingestion -> analytics), no una arquitectura real. Reemplázalas por las
# capas verdaderas de tu proyecto. Si tu orquestador (un pipeline.py, un
# main.py) necesita importar de varias capas a la vez para coordinarlas,
# NO lo agregues a la lista `layers` -- déjalo fuera del contrato a
# propósito, como una excepción documentada, en vez de forzarlo a encajar
# en una capa. Ver AGENTS.md, sección "Arquitectura".
# --------------------------------------------------------------------
[tool.importlinter]
root_package = "guitar_tabs_analysis"

[[tool.importlinter.contracts]]
name = "Capas: no se saltan ni se invierten (EJEMPLO -- reemplaza por tu arquitectura real)"
type = "layers"
layers = [
    "guitar_tabs_analysis.separacion",
    "guitar_tabs_analysis.transcripcion",
    "guitar_tabs_analysis.analytics",
    "guitar_tabs_analysis.ingestion",
]
# `guitar_tabs_analysis.medicion` (Feature 004) NO aparece en esta lista,
# a propósito: es el orquestador que coordina las tres capas de arriba
# (ingestion -> separacion -> analytics) en un solo lugar, exactamente el
# caso que AGENTS.md ya anticipa ("si el proyecto tiene un orquestador...
# no lo agregues a la lista `layers`... déjalo fuera a propósito, como una
# excepción documentada" -- research.md #6 de 004-medicion-linea-base).
# `guitar_tabs_analysis.deteccion` (Feature 006, hito 2) tampoco aparece
# en esta lista, mismo criterio exacto que `medicion`: es el orquestador
# que coordina `ingestion`/`transcripcion`/`analytics` a la vez
# (research.md #11 de 006-deteccion-notas-guitarra-limpia).
# `guitar_tabs_analysis.transcripcion` sí se agrega, en la misma posición
# relativa que `separacion` (puede importar de `analytics`/`ingestion`,
# ninguna de las dos importa de vuelta) -- mismo tratamiento que cuando se
# agregó `separacion` (Feature 003).

[[tool.importlinter.contracts]]
name = "quality es transversal: no depende de analytics (EJEMPLO)"
type = "forbidden"
source_modules = ["guitar_tabs_analysis.quality"]
forbidden_modules = [
    "guitar_tabs_analysis.analytics",
]
